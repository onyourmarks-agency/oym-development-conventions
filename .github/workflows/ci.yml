name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate convention cards
        run: node scripts/validate-cards.mjs
      - name: Sync script self-test
        run: node scripts/self-test.mjs
